server:
  address: 0.0.0.0
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:1433;databaseName=ktx_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jackson:
  serialization:
    indent_output: true

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql: warn